<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mrs Matthews RE Hub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="hub-page">

  <main class="hub">

    <header class="hub-header">
      <h1>Mrs Matthews RE Hub</h1>
      <p>Choose a resource to get started.</p>
    </header>

    <section class="hub-grid">

      <a href="ethos.html" class="hub-card ethos-card">

        <div class="hub-icon">
          🤖
        </div>

        <h2>Ask Dr Ethos</h2>

        <p>
          Ask ethical questions and explore different
          moral viewpoints.
        </p>

        <span class="hub-open">
          Open →
        </span>

      </a>


      <div class="hub-card progress-card">

        <div class="hub-icon">
          🚧
        </div>

        <h2>Work in Progress</h2>

        <p>
          A new RE resource will be added here soon.
        </p>

        <span class="hub-coming">
          Coming Soon
        </span>

      </div>

    </section>

  </main>
<div id="peekRobot" class="peek-robot">
  <div class="peek-head">
    <div class="peek-face">
      <div class="peek-eyes">
        <span></span>
        <span></span>
      </div>
      <div class="peek-mouth"></div>
    </div>
  </div>
</div>
  <script>
  const peekRobot = document.getElementById("peekRobot");

  const peekPositions = [
    "peek-left",
    "peek-right",
    "peek-bottom-left",
    "peek-bottom-right"
  ];

  function showPeekRobot() {
    peekRobot.className = "peek-robot";

    const randomPosition =
      peekPositions[Math.floor(Math.random() * peekPositions.length)];

    peekRobot.classList.add(randomPosition);

    setTimeout(() => {
      peekRobot.classList.add("show");
    }, 100);

    setTimeout(() => {
      peekRobot.classList.remove("show");
    }, 3500);

    const nextPeek =
      Math.floor(Math.random() * 12000) + 10000;

    setTimeout(showPeekRobot, nextPeek);
  }

  setTimeout(showPeekRobot, 5000);
</script>
</body>
</html>
